
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tastiera Accessibile</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Disabilita selezioni e zoom accidentali per un'esperienza simile a un'app nativa */
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        html, body {
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0f172a; /* Slate 900 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between p-2 select-none">


    <!-- TOP 30% CONTAINER -->
    <div id="top-container" class="h-[30%] flex flex-col gap-2 w-full max-w-2xl mx-auto">
        
        <!-- 20% SPAZIO: Casella di testo (partecipa al 30% totale) -->
        <div class="h-[66%] bg-slate-800 border-2 border-slate-600 rounded-2xl p-3 flex items-center justify-between shadow-inner relative overflow-hidden">
            <div id="text-display" class="w-full h-full flex items-center overflow-x-auto whitespace-nowrap text-3xl font-extrabold text-emerald-400 tracking-wider px-1">
                <!-- Il testo digitato apparirà qui -->
            </div>
            <div class="absolute right-2 top-2 text-xs text-slate-400 font-mono" id="char-count">0</div>
        </div>


        <!-- 10% SPAZIO: Barra predittiva e pulsanti azione (partecipa al 30% totale) -->
        <div class="h-[34%] flex items-center gap-2">
            <!-- Predizioni -->
            <div id="predictions-bar" class="flex-1 h-full flex gap-2 overflow-x-auto no-scrollbar items-center">
                <span class="text-xs text-slate-400 italic px-2">Suggerimenti...</span>
            </div>


            <!-- Pulsante Cancella Tutto -->
            <button id="btn-clear" onclick="clearAllText()" class="h-full px-4 bg-rose-600 hover:bg-rose-500 active:scale-95 text-white font-bold rounded-xl flex items-center justify-center shadow-md transition-all text-sm md:text-base border border-rose-400">
                🗑️ Cancella
            </button>


            <!-- Pulsante Parla -->
            <button id="btn-speak" onclick="speakText()" class="h-full px-5 bg-sky-600 hover:bg-sky-500 active:scale-95 text-white font-bold rounded-xl flex items-center justify-center shadow-md transition-all text-sm md:text-base border border-sky-400">
                🔊 Leggi
            </button>
        </div>
    </div>


    <!-- BOTTOM 70% CONTAINER: Tastiera QWERTY Gigante -->
    <div id="keyboard-container" class="h-[70%] w-full max-w-2xl mx-auto flex flex-col justify-between pb-1 pt-2 gap-1.5">
        
        <!-- Riga 1: Numeri e Q W E R T Y U I O P -->
        <div class="flex-1 flex gap-1 w-full">
            <button class="key-btn" onclick="handleKey('1')">1</button>
            <button class="key-btn" onclick="handleKey('2')">2</button>
            <button class="key-btn" onclick="handleKey('3')">3</button>
            <button class="key-btn" onclick="handleKey('4')">4</button>
            <button class="key-btn" onclick="handleKey('5')">5</button>
            <button class="key-btn" onclick="handleKey('6')">6</button>
            <button class="key-btn" onclick="handleKey('7')">7</button>
            <button class="key-btn" onclick="handleKey('8')">8</button>
            <button class="key-btn" onclick="handleKey('9')">9</button>
            <button class="key-btn" onclick="handleKey('0')">0</button>
        </div>


        <!-- Riga 2: A S D F G H J K L -->
        <div class="flex-1 flex gap-1 w-full px-1">
            <button class="key-btn" onclick="handleKey('Q')">Q</button>
            <button class="key-btn" onclick="handleKey('W')">W</button>
            <button class="key-btn" onclick="handleKey('E')">E</button>
            <button class="key-btn" onclick="handleKey('R')">R</button>
            <button class="key-btn" onclick="handleKey('T')">T</button>
            <button class="key-btn" onclick="handleKey('Y')">Y</button>
            <button class="key-btn" onclick="handleKey('U')">U</button>
            <button class="key-btn" onclick="handleKey('I')">I</button>
            <button class="key-btn" onclick="handleKey('O')">O</button>
            <button class="key-btn" onclick="handleKey('P')">P</button>
        </div>


        <!-- Riga 3: A S D F G H J K L -->
        <div class="flex-1 flex gap-1 w-full px-4">
            <button class="key-btn" onclick="handleKey('A')">A</button>
            <button class="key-btn" onclick="handleKey('S')">S</button>
            <button class="key-btn" onclick="handleKey('D')">D</button>
            <button class="key-btn" onclick="handleKey('F')">F</button>
            <button class="key-btn" onclick="handleKey('G')">G</button>
            <button class="key-btn" onclick="handleKey('H')">H</button>
            <button class="key-btn" onclick="handleKey('J')">J</button>
            <button class="key-btn" onclick="handleKey('K')">K</button>
            <button class="key-btn" onclick="handleKey('L')">L</button>
        </div>


        <!-- Riga 4: Z X C V B N M + Backspace -->
        <div class="flex-1 flex gap-1 w-full px-8">
            <button class="key-btn" onclick="handleKey('Z')">Z</button>
            <button class="key-btn" onclick="handleKey('X')">X</button>
            <button class="key-btn" onclick="handleKey('C')">C</button>
            <button class="key-btn" onclick="handleKey('V')">V</button>
            <button class="key-btn" onclick="handleKey('B')">B</button>
            <button class="key-btn" onclick="handleKey('N')">N</button>
            <button class="key-btn" onclick="handleKey('M')">M</button>
            <!-- Tasto Cancella singolo carattere -->
            <button class="flex-[1.5] bg-amber-700 hover:bg-amber-600 active:scale-95 text-white font-extrabold text-lg rounded-xl flex items-center justify-center shadow-md border border-amber-500 transition-all" onclick="handleDelete()">⌫</button>
        </div>


        <!-- Riga 5: Punto, Spazio gigante, Punto Interrogativo -->
        <div class="flex-1 flex gap-1.5 w-full">
            <button class="flex-1 bg-slate-700 hover:bg-slate-600 active:scale-95 text-white font-extrabold text-xl rounded-xl flex items-center justify-center shadow-md border border-slate-500 transition-all" onclick="handleKey('.')">.</button>
            <button class="flex-[4] bg-slate-700 hover:bg-slate-600 active:scale-95 text-white font-extrabold text-xl rounded-xl flex items-center justify-center shadow-md border border-slate-500 transition-all" onclick="handleKey(' ')">SPAZIO</button>
            <button class="flex-1 bg-slate-700 hover:bg-slate-600 active:scale-95 text-white font-extrabold text-xl rounded-xl flex items-center justify-center shadow-md border border-slate-500 transition-all" onclick="handleKey('?')">?</button>
        </div>


    </div>


    <!-- Stili aggiuntivi per i tasti della tastiera -->
    <style>
        .key-btn {
            flex: 1;
            background-color: #334155; /* Slate 700 */
            color: #f8fafc; /* Slate 50 */
            font-weight: 800;
            font-size: 1.3rem;
            border-radius: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            border: 1px solid #475569;
            transition: all 0.05s ease;
        }
        .key-btn:active {
            background-color: #1e293b;
            transform: scale(0.94);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        }
        @media (min-height: 700px) {
            .key-btn { font-size: 1.6rem; }
        }
    </style>


    <!-- Logica JavaScript per gestione testo, predizioni e sintesi vocale -->
    <script>
        // Dizionario comune italiano per predizioni rapide
        const dictionary = [
            "CIAO", "COME", "STAI", "BENE", "GRAZIE", "SI", "NO", "PER FAVORE",
            "ACQUA", "MANGIARE", "BERE", "CASA", "ANDARE", "FATTO", "TUTTO",
            "TELEFONO", "YOUTUBE", "MUSICA", "VIDEO", "GIOCO", "USCIRE", "PARLARE",
            "MIO", "TUA", "QUESTO", "QUELLO", "DOMANI", "OGGI", "TEMPO", "BELLO",
            "AIUTO", "VORREI", "VOGLIO", "HO", "HAI", "FATTO", "ASCOLTARE"
        ];


        let currentText = "";


        // Reset all'avvio
        window.onload = function() {
            currentText = "";
            updateDisplay();
        };


        function handleKey(char) {
            currentText += char;
            updateDisplay();
            updatePredictions();
        }


        function handleDelete() {
            if (currentText.length > 0) {
                currentText = currentText.slice(0, -1);
                updateDisplay();
                updatePredictions();
            }
        }


        function clearAllText() {
            currentText = "";
            updateDisplay();
            updatePredictions();
        }


        function updateDisplay() {
            const display = document.getElementById("text-display");
            display.innerText = currentText;
            display.scrollLeft = display.scrollWidth; // Auto-scroll verso destra se il testo è lungo
            document.getElementById("char-count").innerText = currentText.length;
        }


        function updatePredictions() {
            const bar = document.getElementById("predictions-bar");
            bar.innerHTML = "";


            if (!currentText || currentText.trim() === "") {
                bar.innerHTML = '<span class="text-xs text-slate-400 italic px-2">Suggerimenti...</span>';
                return;
            }


            // Prendi l'ultima parola digitata
            const words = currentText.trim().split(" ");
            const lastWord = words[words.length - 1].toUpperCase();


            if (!lastWord) {
                bar.innerHTML = '<span class="text-xs text-slate-400 italic px-2">Suggerimenti...</span>';
                return;
            }


            // Filtra parole dal dizionario che iniziano con l'ultima parola digitata
            const matches = dictionary.filter(w => w.startsWith(lastWord) && w !== lastWord).slice(0, 3);


            if (matches.length === 0) {
                bar.innerHTML = '<span class="text-xs text-slate-500 px-2">Nessun suggerimento</span>';
                return;
            }


            matches.forEach(word => {
                const btn = document.createElement("button");
                btn.className = "h-full px-3 bg-emerald-700 hover:bg-emerald-600 active:scale-95 text-white font-bold rounded-xl text-xs md:text-sm shadow flex items-center justify-center border border-emerald-500 whitespace-nowrap transition-all";
                btn.innerText = word;
                btn.onclick = () => {
                    // Sostituisci l'ultima parola parziale con la parola predetta completa + spazio
                    words[words.length - 1] = word;
                    currentText = words.join(" ") + " ";
                    updateDisplay();
                    updatePredictions();
                };
                bar.appendChild(btn);
            });
        }


        function speakText() {
            if (!currentText || currentText.trim() === "") return;
            
            if ('speechSynthesis' in window) {
                // Interrompi eventuali letture in corso
                window.speechSynthesis.cancel();


                const utterance = new SpeechSynthesisUtterance(currentText);
                utterance.lang = 'it-IT';
                utterance.rate = 0.9; // Leggermente più lento per chiarezza
                window.speechSynthesis.speak(utterance);
            }
        }
    </script>
</body>
</html>
